name: Build PS4 Mesa stack

on:
push:
branches:
- main
paths:
- 'mesa-ps4/'
- 'libdrm-ps4/'
- 'lib32-mesa-ps4/**'
- '.github/workflows/build.yml'
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

container:
  image: archlinux:latest

env:
  REPO_DIR: repo
  MESA_WHICH_LLVM: "4"

steps:

  - uses: actions/checkout@v6
    with:
      fetch-depth: 0
      persist-credentials: true

  # ==================================================
  # Initialize Arch
  # ==================================================

  - name: Initialize Arch
    shell: bash
    run: |
      set -euxo pipefail

      pacman-key --init
      pacman-key --populate archlinux

      echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
        > /etc/pacman.d/mirrorlist

      # Enable multilib
      sed -i '/^\#multilib/,/^\#Include/s/^#//' /etc/pacman.conf

      pacman -Syu --noconfirm

  # ==================================================
  # Build tools
  # ==================================================

  - name: Install build tools
    shell: bash
    run: |
      set -euxo pipefail

      pacman -S --noconfirm --needed \
        base-devel \
        git \
        sudo \
        fakeroot \
        repo

  # ==================================================
  # Create builder
  # ==================================================

  - name: Create builder user
    shell: bash
    run: |
      set -euxo pipefail

      useradd -m builder

      echo "builder ALL=(ALL) NOPASSWD: ALL" \
        >> /etc/sudoers

      chown -R builder:builder "$GITHUB_WORKSPACE"

  # ==================================================
  # Install LLVM / Rusticl dependencies
  # ==================================================

  - name: Install LLVM and Rusticl dependencies
    shell: bash
    run: |
      set -euxo pipefail

      pacman -S --noconfirm --needed \
        llvm \
        llvm-libs \
        clang \
        libclc \
        spirv-llvm-translator \
        spirv-tools \
        rust \
        rust-bindgen

      echo
      echo "===== LLVM ====="
      llvm-config --version
      clang --version | head -n 1

      LLVM_VERSION="$(llvm-config --version)"

      case "$LLVM_VERSION" in
        22.*)
          echo "LLVM 22 detected: $LLVM_VERSION"
          ;;
        *)
          echo "ERROR: LLVM 22 required, got: $LLVM_VERSION"
          exit 1
          ;;
      esac

  # ==================================================
  # Check source configuration
  # ==================================================

  - name: Check Mesa configuration
    shell: bash
    run: |
      set -euxo pipefail

      echo "MESA_WHICH_LLVM=$MESA_WHICH_LLVM"

      echo
      echo "===== Repository ====="
      ls -la

      echo
      echo "===== mesa-ps4 directory ====="
      ls -la mesa-ps4

      echo
      echo "===== PKGBUILD version ====="
      grep -E '^pkgver=|^pkgrel=' \
        mesa-ps4/PKGBUILD

      echo
      echo "===== Mesa source ====="
      grep -E 'archive.mesa3d|mesa.git|pkgver' \
        mesa-ps4/PKGBUILD || true

  # ==================================================
  # Build packages
  # ==================================================

  - name: Build packages
    shell: bash
    run: |
      set -euxo pipefail

      mkdir -p "$GITHUB_WORKSPACE/$REPO_DIR"

      build_package() {
        local pkg="$1"

        echo
        echo "========================================"
        echo "BUILDING $pkg"
        echo "========================================"

        cd "$GITHUB_WORKSPACE/$pkg"

        chown -R builder:builder .

        sudo -u builder bash -c "
          cd '$GITHUB_WORKSPACE/$pkg'
          export MESA_WHICH_LLVM='$MESA_WHICH_LLVM'
          makepkg -sfc --noconfirm --skippgpcheck
        "

        PKG_FILE=$(find . -maxdepth 1 \
          -type f \
          -name "*.pkg.tar.zst" \
          | head -n1)

        if [ -z "$PKG_FILE" ]; then
          echo "ERROR: No package generated for $pkg"
          exit 1
        fi

        echo
        echo "Generated package:"
        echo "$PKG_FILE"

        cp "$PKG_FILE" \
          "$GITHUB_WORKSPACE/$REPO_DIR/"

        echo
        echo "Package information:"
        pacman -Qip "$PKG_FILE"
      }

      # Build libdrm first
      build_package libdrm-ps4

      # Install libdrm-ps4 before Mesa build if needed
      LIBDRM_PKG=$(find "$GITHUB_WORKSPACE/libdrm-ps4" \
        -maxdepth 1 \
        -type f \
        -name "*.pkg.tar.zst" \
        | head -n1)

      if [ -n "$LIBDRM_PKG" ]; then
        echo "Installing libdrm-ps4 for Mesa build..."
        pacman -U --noconfirm "$LIBDRM_PKG"
      fi

      # Build Mesa PS4
      build_package mesa-ps4

  # ==================================================
  # Inspect Mesa package
  # ==================================================

  - name: Inspect Mesa package
    shell: bash
    run: |
      set -euxo pipefail

      cd "$GITHUB_WORKSPACE/$REPO_DIR"

      echo "===== Generated packages ====="
      ls -lh

      MESA_PKG=$(find . \
        -maxdepth 1 \
        -type f \
        -name "mesa-ps4-*.pkg.tar.zst" \
        | head -n1)

      if [ -z "$MESA_PKG" ]; then
        echo "ERROR: mesa-ps4 package not found"
        exit 1
      fi

      echo
      echo "===== Rusticl files ====="

      tar -tf "$MESA_PKG" \
        | grep -Ei \
          'Rusticl|rusticl|libRusticlOpenCL|OpenCL' \
        || true

      echo
      echo "===== radeonsi files ====="

      tar -tf "$MESA_PKG" \
        | grep -Ei 'radeonsi' \
        || true

      echo
      echo "===== Build LLVM ====="

      pacman -Q llvm llvm-libs clang

  # ==================================================
  # Create repository database
  # ==================================================

  - name: Create repo
    shell: bash
    run: |
      set -euxo pipefail

      cd "$GITHUB_WORKSPACE/$REPO_DIR"

      rm -f \
        ps4-video.db \
        ps4-video.db.tar.zst \
        ps4-video.files \
        ps4-video.files.tar.zst

      repo-add \
        ps4-video.db.tar.zst \
        *.pkg.tar.zst

      ls -lh

  # ==================================================
  # Commit artifacts
  # ==================================================

  - name: Commit artifacts
    working-directory: ${{ github.workspace }}
    shell: bash
    run: |
      set -euxo pipefail

      git config user.name "github-actions[bot]"
      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add "$REPO_DIR"

      if git diff --cached --quiet; then
        echo "No artifact changes to commit."
      else
        git commit \
          -m "Update PS4 Mesa stack + Rusticl $(date -u +'%Y-%m-%d %H:%M UTC')"

        git push
      fi
